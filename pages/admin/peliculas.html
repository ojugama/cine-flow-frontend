<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CineFlow - Películas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="../../assets/css/styles.css" />
  </head>
  <body class="bg-light">
    <div id="navbar"></div>
    <main class="container py-4">
      <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
        <div>
          <h1 class="h3 fw-bold mb-1">Películas</h1>
          <p class="text-muted mb-0">Administra el catálogo de películas de CineFlow.</p>
        </div>
        <button class="btn btn-primary" id="btn-new" type="button">Crear película</button>
      </div>
      <div id="alert" class="alert d-none" role="alert"></div>
      <section class="card border-0 shadow-sm mb-4 d-none" id="form-card">
        <div class="card-body">
          <h2 class="h5 fw-bold" id="form-title">Crear película</h2>
          <form id="movie-form" novalidate>
            <div id="form-alert" class="alert d-none" role="alert"></div>
            <div class="row g-3">
              <div class="col-md-6">
                <label for="titulo" class="form-label">Título</label>
                <input class="form-control" id="titulo" name="titulo" maxlength="100" required />
              </div>
              <div class="col-md-6">
                <label for="genero" class="form-label">Género</label>
                <input class="form-control" id="genero" name="genero" maxlength="100" />
              </div>
              <div class="col-md-4">
                <label for="duracionMinutos" class="form-label">Duración (minutos)</label>
                <input class="form-control" type="number" id="duracionMinutos" name="duracionMinutos" min="1" step="1" required />
              </div>
              <div class="col-12">
                <label for="sinopsis" class="form-label">Sinopsis</label>
                <textarea class="form-control" id="sinopsis" name="sinopsis" rows="4"></textarea>
              </div>
            </div>
            <div class="d-flex gap-2 mt-3">
              <button class="btn btn-primary" type="submit" id="btn-save">Guardar película</button>
              <button class="btn btn-outline-secondary" type="button" id="btn-cancel">Cancelar</button>
            </div>
          </form>
        </div>
      </section>
      <div class="card border-0 shadow-sm">
        <div class="table-responsive">
          <table class="table table-hover align-middle mb-0">
            <thead class="table-light"><tr><th>ID</th><th>Título</th><th>Género</th><th>Duración</th><th>Sinopsis</th><th class="text-end">Acciones</th></tr></thead>
            <tbody id="movies-body"><tr><td colspan="6" class="text-center text-muted py-4">Cargando películas...</td></tr></tbody>
          </table>
        </div>
      </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="../../js/features/peliculas/peliculasView.js"></script>
  </body>
</html>
