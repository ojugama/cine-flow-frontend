<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CineFlow - Gestión de Usuarios</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../../assets/css/styles.css" />
  </head>
  <body class="bg-light">
    <div id="navbar-container"></div>

    <div class="container mt-5">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Gestión de Usuarios</h2>
      </div>

      <div id="alert-message" class="alert d-none" role="alert"></div>

      <div class="card shadow-sm border-0">
        <div class="card-body">
          <div class="table-responsive">
            <table class="table table-hover align-middle">
              <thead class="table-light">
                <tr>
                  <th>ID</th>
                  <th>Nombres</th>
                  <th>Apellidos</th>
                  <th>Email</th>
                  <th>Rol</th>
                  <th>Estado</th>
                  <th class="text-center">Acciones</th>
                </tr>
              </thead>
              <tbody id="usuarios-tbody">
                <tr>
                  <td colspan="7" class="text-center text-muted">
                    Cargando usuarios...
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
    <div
      class="modal fade"
      id="editUsuarioModal"
      tabindex="-1"
      aria-labelledby="editUsuarioModalLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="editUsuarioModalLabel">
              Editar Usuario
            </h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <form id="edit-usuario-form">
            <div class="modal-body">
              <div class="mb-3">
                <label for="edit-nombres" class="form-label">Nombres</label>
                <input
                  type="text"
                  class="form-control"
                  id="edit-nombres"
                  required
                />
              </div>
              <div class="mb-3">
                <label for="edit-apellidos" class="form-label">Apellidos</label>
                <input
                  type="text"
                  class="form-control"
                  id="edit-apellidos"
                  required
                />
              </div>
              <div class="mb-3">
                <label for="edit-email" class="form-label">Email</label>
                <input
                  type="email"
                  class="form-control"
                  id="edit-email"
                  required
                />
              </div>
            </div>
            <div class="modal-footer">
              <button
                type="button"
                class="btn btn-secondary"
                data-bs-dismiss="modal"
              >
                Cancelar
              </button>
              <button type="submit" class="btn btn-primary" id="btn-save-edit">
                Guardar Cambios
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="../../js/core/components/navbar.js"></script>
    <script
      type="module"
      src="../../js/features/usuarios/adminUsuariosView.js"
    ></script>
  </body>
</html>
