<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CineFlow - Usuarios</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../../assets/css/styles.css" />
  </head>
  <body class="bg-light">
    <div id="navbar"></div>

    <main class="container py-4">
      <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
        <h1 class="h3 fw-bold mb-0">Usuarios</h1>
        <div class="d-flex align-items-center gap-2">
          <label for="page-size" class="form-label mb-0 small text-muted">Filas por página</label>
          <select id="page-size" class="form-select form-select-sm w-auto">
            <option value="10" selected>10</option>
            <option value="20">20</option>
            <option value="50">50</option>
          </select>
        </div>
      </div>

      <div id="alert" class="alert d-none" role="alert"></div>

      <div class="card border-0 shadow-sm">
        <div class="table-responsive">
          <table class="table table-hover align-middle mb-0">
            <thead class="table-light">
              <tr>
                <th scope="col">ID</th>
                <th scope="col">Nombre</th>
                <th scope="col">Email</th>
                <th scope="col">Rol</th>
                <th scope="col" class="text-end">Acciones</th>
              </tr>
            </thead>
            <tbody id="users-body"></tbody>
          </table>
        </div>
      </div>

      <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mt-3">
        <small class="text-muted" id="summary"></small>
        <nav aria-label="Paginación de usuarios">
          <ul class="pagination pagination-sm mb-0" id="pagination"></ul>
        </nav>
      </div>
    </main>

    <!-- Modal: editar usuario -->
    <div class="modal fade" id="edit-modal" tabindex="-1" aria-labelledby="edit-title" aria-hidden="true">
      <div class="modal-dialog">
        <form class="modal-content" id="edit-form" novalidate>
          <div class="modal-header">
            <h2 class="modal-title h5" id="edit-title">Editar usuario</h2>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
          </div>
          <div class="modal-body">
            <div id="edit-alert" class="alert d-none" role="alert"></div>
            <div class="mb-3">
              <label for="edit-nombres" class="form-label">Nombres</label>
              <input type="text" class="form-control" id="edit-nombres" name="nombres" required />
            </div>
            <div class="mb-3">
              <label for="edit-apellidos" class="form-label">Apellidos</label>
              <input type="text" class="form-control" id="edit-apellidos" name="apellidos" required />
            </div>
            <div class="mb-1">
              <label for="edit-email" class="form-label">Email</label>
              <input type="email" class="form-control" id="edit-email" name="email" required />
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
            <button type="submit" class="btn btn-primary" id="btn-edit-save">Guardar cambios</button>
          </div>
        </form>
      </div>
    </div>

    <!-- Modal: confirmar eliminación -->
    <div class="modal fade" id="delete-modal" tabindex="-1" aria-labelledby="delete-title" aria-hidden="true">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h2 class="modal-title h5" id="delete-title">Eliminar usuario</h2>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
          </div>
          <div class="modal-body">
            <div id="delete-alert" class="alert d-none" role="alert"></div>
            <p class="mb-0">
              Vas a eliminar a <strong id="delete-name"></strong>. Esta acción no se puede deshacer.
            </p>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
            <button type="button" class="btn btn-danger" id="btn-delete-confirm">Eliminar usuario</button>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="../../js/features/usuarios/usersView.js"></script>
  </body>
</html>
