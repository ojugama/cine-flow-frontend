<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CineFlow - Funciones</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../../assets/css/styles.css" />
  </head>
  <body class="bg-light">
    <div id="navbar"></div>
    <main class="container py-4">
      <div
        class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3"
      >
        <div>
          <h1 class="h3 fw-bold mb-1">Funciones</h1>
          <p class="text-muted mb-0">
            Programación de películas por sala y sucursal.
          </p>
        </div>
        <div class="d-flex align-items-center gap-3">
          <div class="d-flex align-items-center gap-2">
            <label for="page-size" class="form-label mb-0 small text-muted"
              >Filas por página</label
            >
            <select id="page-size" class="form-select form-select-sm w-auto">
              <option value="10" selected>10</option>
              <option value="20">20</option>
              <option value="50">50</option>
            </select>
          </div>
          <button class="btn btn-primary" id="btn-new" type="button">
            Crear función
          </button>
        </div>
      </div>

      <div id="alert" class="alert d-none" role="alert"></div>

      <section class="card border-0 shadow-sm mb-4 d-none" id="form-card">
        <div class="card-body">
          <h2 class="h5 fw-bold" id="form-title">Crear función</h2>
          <form id="function-form" novalidate>
            <div id="form-alert" class="alert d-none" role="alert"></div>
            <div class="row g-3">
              <div class="col-md-6">
                <label class="form-label" for="idPelicula">Película</label>
                <select
                  class="form-select"
                  id="idPelicula"
                  name="idPelicula"
                  required
                >
                  <option value="">Selecciona una película</option>
                </select>
              </div>
              <div class="col-md-6">
                <label class="form-label" for="idSala">Sala / sucursal</label>
                <select class="form-select" id="idSala" name="idSala" required>
                  <option value="">Selecciona una sala</option>
                </select>
              </div>
              <div class="col-md-6">
                <label class="form-label" for="fechaHoraInicio"
                  >Fecha y hora de inicio</label
                >
                <input
                  class="form-control"
                  type="datetime-local"
                  id="fechaHoraInicio"
                  name="fechaHoraInicio"
                  required
                />
              </div>
              <div class="col-md-6">
                <label class="form-label" for="fechaHoraFin"
                  >Fecha y hora de fin</label
                >
                <input
                  class="form-control"
                  type="datetime-local"
                  id="fechaHoraFin"
                  name="fechaHoraFin"
                  required
                />
              </div>
            </div>
            <div class="d-flex gap-2 mt-3">
              <button class="btn btn-primary" type="submit" id="btn-save">
                Guardar función
              </button>
              <button
                class="btn btn-outline-secondary"
                type="button"
                id="btn-cancel"
              >
                Cancelar
              </button>
            </div>
          </form>
        </div>
      </section>

      <div class="card border-0 shadow-sm">
        <div class="table-responsive">
          <table class="table table-hover align-middle mb-0">
            <thead class="table-light">
              <tr>
                <th>ID</th>
                <th>Película</th>
                <th>Sucursal</th>
                <th>Sala</th>
                <th>Inicio</th>
                <th>Fin</th>
                <th class="text-end">Acciones</th>
              </tr>
            </thead>
            <tbody id="functions-body">
              <tr>
                <td colspan="7" class="text-center text-muted py-4">
                  Cargando funciones...
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

      <div
        class="d-flex flex-wrap justify-content-between align-items-center gap-2 mt-3"
      >
        <small class="text-muted" id="summary"></small>
        <nav aria-label="Paginación de funciones">
          <ul class="pagination pagination-sm mb-0" id="pagination"></ul>
        </nav>
      </div>
    </main>

    <!-- Modal: confirmar eliminación de función -->
    <div
      class="modal fade"
      id="delete-modal"
      tabindex="-1"
      aria-labelledby="delete-title"
      aria-hidden="true"
    >
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h2 class="modal-title h5" id="delete-title">Eliminar función</h2>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Cerrar"
            ></button>
          </div>
          <div class="modal-body">
            <div id="delete-alert" class="alert d-none" role="alert"></div>
            <p class="mb-0">
              Vas a eliminar la función de <strong id="delete-name"></strong>.
              Esta acción no se puede deshacer.
            </p>
          </div>
          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-outline-secondary"
              data-bs-dismiss="modal"
            >
              Cancelar
            </button>
            <button
              type="button"
              class="btn btn-danger"
              id="btn-delete-confirm"
            >
              Eliminar función
            </button>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script
      type="module"
      src="../../js/features/funciones/funcionesView.js"
    ></script>
  </body>
</html>
