<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CineFlow - Mi perfil</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../assets/css/styles.css" />
  </head>
  <body class="bg-light">
    <div id="navbar"></div>

    <main class="container py-4">
      <h1 class="h3 fw-bold mb-4">Mi perfil</h1>

      <div class="row g-4">
        <div class="col-lg-6">
          <div class="card border-0 shadow-sm h-100">
            <div class="card-body p-4">
              <h2 class="h5 fw-bold mb-3">Datos personales</h2>
              <div id="profile-alert" class="alert d-none" role="alert"></div>

              <form id="profile-form" novalidate>
                <div class="mb-3">
                  <label for="nombres" class="form-label">Nombres</label>
                  <input
                    type="text"
                    class="form-control"
                    id="nombres"
                    name="nombres"
                    required
                  />
                </div>
                <div class="mb-3">
                  <label for="apellidos" class="form-label">Apellidos</label>
                  <input
                    type="text"
                    class="form-control"
                    id="apellidos"
                    name="apellidos"
                    required
                  />
                </div>
                <div class="mb-3">
                  <label for="email" class="form-label">Email</label>
                  <input
                    type="email"
                    class="form-control"
                    id="email"
                    name="email"
                    required
                  />
                </div>
                <button type="submit" class="btn btn-primary" id="btn-profile">
                  Guardar cambios
                </button>
              </form>
            </div>
          </div>
        </div>

        <div class="col-lg-6">
          <div class="card border-0 shadow-sm h-100">
            <div class="card-body p-4">
              <h2 class="h5 fw-bold mb-3">Cambiar contraseña</h2>
              <div id="password-alert" class="alert d-none" role="alert"></div>

              <form id="password-form" novalidate>
                <div class="mb-3">
                  <label for="currentPassword" class="form-label"
                    >Contraseña actual</label
                  >
                  <input
                    type="password"
                    class="form-control"
                    id="currentPassword"
                    name="currentPassword"
                    autocomplete="current-password"
                    required
                  />
                </div>
                <div class="mb-3">
                  <label for="newPassword" class="form-label"
                    >Contraseña nueva</label
                  >
                  <input
                    type="password"
                    class="form-control"
                    id="newPassword"
                    name="newPassword"
                    autocomplete="new-password"
                    required
                  />
                </div>
                <div class="mb-3">
                  <label for="confirmPassword" class="form-label"
                    >Confirmar contraseña nueva</label
                  >
                  <input
                    type="password"
                    class="form-control"
                    id="confirmPassword"
                    name="confirmPassword"
                    autocomplete="new-password"
                    required
                  />
                </div>
                <button type="submit" class="btn btn-primary" id="btn-password">
                  Cambiar contraseña
                </button>
              </form>
            </div>
          </div>
        </div>
        <div class="col-12">
          <div class="card border-0 shadow-sm border-danger">
            <div
              class="card-body p-4 d-flex flex-wrap justify-content-between align-items-center gap-3"
            >
              <div>
                <h2 class="h5 fw-bold text-danger mb-1">Zona de peligro</h2>
                <p class="text-muted mb-0">
                  Al eliminar tu cuenta, se desactivará tu acceso al sistema y
                  se cerrará tu sesión actual.
                </p>
              </div>
              <button
                type="button"
                class="btn btn-outline-danger"
                id="btn-delete-account"
              >
                Eliminar mi cuenta
              </button>
            </div>
          </div>
        </div>
      </div>
    </main>

    <div
      class="modal fade"
      id="delete-modal"
      tabindex="-1"
      aria-labelledby="delete-title"
      aria-hidden="true"
    >
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h2 class="modal-title h5" id="delete-title">Eliminar mi cuenta</h2>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Cerrar"
            ></button>
          </div>
          <div class="modal-body">
            <div id="delete-alert" class="alert d-none" role="alert"></div>
            <p class="mb-0">
              ¿Estás seguro de que deseas eliminar tu cuenta? Se cerrará tu
              sesión actual y esta acción no se puede deshacer.
            </p>
          </div>
          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-outline-secondary"
              data-bs-dismiss="modal"
            >
              Cancelar
            </button>
            <button
              type="button"
              class="btn btn-danger"
              id="btn-delete-confirm"
            >
              Eliminar cuenta
            </button>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="../js/features/usuarios/perfilView.js"></script>
  </body>
</html>
