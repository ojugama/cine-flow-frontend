<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CineFlow - Mi Perfil</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../assets/css/styles.css" />
  </head>
  <body class="bg-light">
    <!-- Navbar Component -->
    <div id="navbar-container"></div>

    <div class="container mt-5" style="max-width: 800px">
      <h2 class="mb-4 text-primary fw-bold">Mi Perfil</h2>
      <div id="alert-message" class="alert d-none" role="alert"></div>

      <!-- Tarjeta de Datos Personales -->
      <div class="card shadow-sm border-0 mb-4">
        <div class="card-body p-4">
          <h4 class="card-title mb-4">Datos Personales</h4>
          <form id="perfil-form">
            <div class="row">
              <div class="col-md-6 mb-3">
                <label for="perfil-nombres" class="form-label">Nombres</label>
                <input
                  type="text"
                  class="form-control"
                  id="perfil-nombres"
                  required
                />
              </div>
              <div class="col-md-6 mb-3">
                <label for="perfil-apellidos" class="form-label"
                  >Apellidos</label
                >
                <input
                  type="text"
                  class="form-control"
                  id="perfil-apellidos"
                  required
                />
              </div>
            </div>
            <div class="mb-4">
              <label for="perfil-email" class="form-label"
                >Correo Electrónico</label
              >
              <input
                type="email"
                class="form-control"
                id="perfil-email"
                required
              />
            </div>
            <button
              type="submit"
              class="btn btn-primary fw-bold"
              id="btn-save-perfil"
            >
              Actualizar datos
            </button>
          </form>
        </div>
      </div>

      <!-- Tarjeta de Cambio de Contraseña -->
      <div class="card shadow-sm border-0 mb-4">
        <div class="card-body p-4">
          <h4 class="card-title mb-4">Seguridad</h4>
          <form id="password-form">
            <div class="mb-3">
              <label for="current-password" class="form-label"
                >Contraseña Actual</label
              >
              <input
                type="password"
                class="form-control"
                id="current-password"
                required
              />
            </div>
            <div class="mb-4">
              <label for="new-password" class="form-label"
                >Nueva Contraseña</label
              >
              <input
                type="password"
                class="form-control"
                id="new-password"
                required
              />
            </div>
            <button
              type="submit"
              class="btn btn-secondary fw-bold"
              id="btn-save-password"
            >
              Cambiar contraseña
            </button>
          </form>
        </div>
      </div>

      <!-- Tarjeta de Eliminación de Cuenta -->
      <div class="card shadow-sm border-danger mb-5">
        <div class="card-body p-4">
          <h4 class="card-title text-danger mb-3">Zona Peligrosa</h4>
          <p class="text-muted mb-4">
            Al eliminar tu cuenta, perderás el acceso a CineFlow y tu sesión se
            cerrará de inmediato.
          </p>
          <button
            class="btn btn-outline-danger fw-bold"
            id="btn-delete-account"
          >
            Eliminar mi cuenta
          </button>
        </div>
      </div>
    </div>

    <script type="module" src="../js/core/components/navbar.js"></script>
    <script type="module" src="../js/features/usuarios/perfilView.js"></script>
  </body>
</html>
