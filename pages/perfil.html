<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CineFlow - Mi perfil</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../assets/css/styles.css" />
  </head>
  <body class="bg-light">
    <div id="navbar"></div>

    <main class="container py-4">
      <h1 class="h3 fw-bold mb-4">Mi perfil</h1>

      <div class="row g-4">
        <div class="col-lg-6">
          <div class="card border-0 shadow-sm h-100">
            <div class="card-body p-4">
              <h2 class="h5 fw-bold mb-3">Datos personales</h2>
              <div id="profile-alert" class="alert d-none" role="alert"></div>

              <form id="profile-form" novalidate>
                <div class="mb-3">
                  <label for="nombres" class="form-label">Nombres</label>
                  <input type="text" class="form-control" id="nombres" name="nombres" required />
                </div>
                <div class="mb-3">
                  <label for="apellidos" class="form-label">Apellidos</label>
                  <input type="text" class="form-control" id="apellidos" name="apellidos" required />
                </div>
                <div class="mb-3">
                  <label for="email" class="form-label">Email</label>
                  <input type="email" class="form-control" id="email" name="email" required />
                  <div class="form-text">Si lo cambias, tendrás que iniciar sesión de nuevo.</div>
                </div>
                <button type="submit" class="btn btn-primary" id="btn-profile">
                  Guardar cambios
                </button>
              </form>
            </div>
          </div>
        </div>

        <div class="col-lg-6">
          <div class="card border-0 shadow-sm h-100">
            <div class="card-body p-4">
              <h2 class="h5 fw-bold mb-3">Cambiar contraseña</h2>
              <div id="password-alert" class="alert d-none" role="alert"></div>

              <form id="password-form" novalidate>
                <div class="mb-3">
                  <label for="currentPassword" class="form-label">Contraseña actual</label>
                  <input type="password" class="form-control" id="currentPassword"
                         name="currentPassword" autocomplete="current-password" required />
                </div>
                <div class="mb-3">
                  <label for="newPassword" class="form-label">Contraseña nueva</label>
                  <input type="password" class="form-control" id="newPassword"
                         name="newPassword" autocomplete="new-password" required />
                  <div class="form-text">Mínimo 8 caracteres.</div>
                </div>
                <div class="mb-3">
                  <label for="confirmPassword" class="form-label">Confirmar contraseña nueva</label>
                  <input type="password" class="form-control" id="confirmPassword"
                         name="confirmPassword" autocomplete="new-password" required />
                </div>
                <button type="submit" class="btn btn-primary" id="btn-password">
                  Cambiar contraseña
                </button>
              </form>
            </div>
          </div>
        </div>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="../js/features/usuarios/profileView.js"></script>
  </body>
</html>
