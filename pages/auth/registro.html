<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CineFlow - Registro</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../../assets/css/styles.css" />
  </head>
  <body class="bg-light d-flex align-items-center" style="height: 100vh">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-md-5">
          <div class="card shadow-sm border-0 rounded-3">
            <div class="card-body p-5">
              <h2 class="text-center mb-4 fw-bold text-primary">
                Crear cuenta
              </h2>
              <div id="alert-message" class="alert d-none" role="alert"></div>
              <form id="register-form">
                <div class="row">
                  <div class="col-md-6 form-floating mb-3">
                    <input
                      type="text"
                      class="form-control"
                      id="nombres"
                      placeholder="Digite los nombres"
                      required
                    />
                    <label for="nombres" class="ms-2">Nombres</label>
                  </div>
                  <div class="col-md-6 form-floating mb-3">
                    <input
                      type="text"
                      class="form-control"
                      id="apellidos"
                      placeholder="Digite los apellidos"
                      required
                    />
                    <label for="apellidos" class="ms-2">Apellidos</label>
                  </div>
                </div>
                <div class="form-floating mb-3">
                  <input
                    type="email"
                    class="form-control"
                    id="email"
                    placeholder="Digite el email"
                    required
                  />
                  <label for="email">Email</label>
                </div>
                <div class="form-floating mb-4">
                  <input
                    type="password"
                    class="form-control"
                    id="password"
                    placeholder="Digite la contraseña"
                    required
                  />
                  <label for="password">Contraseña</label>
                </div>
                <button
                  type="submit"
                  class="btn btn-primary w-100 py-2 fw-bold mb-3"
                  id="btn-register"
                >
                  Registrarse
                </button>
                <div class="text-center">
                  <span class="text-muted">¿Ya estás registrado?</span>
                  <a
                    href="../../index.html"
                    class="text-decoration-none fw-bold"
                    >Inicia sesión aquí</a
                  >
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script
      type="module"
      src="../../js/features/usuarios/registroView.js"
    ></script>
  </body>
</html>
