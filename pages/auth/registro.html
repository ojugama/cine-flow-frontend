<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CineFlow - Crear cuenta</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../../assets/css/styles.css" />
  </head>
  <body class="bg-light d-flex align-items-center" style="min-height: 100vh">
    <div class="container py-4">
      <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
          <div class="card shadow-sm border-0 rounded-3">
            <div class="card-body p-5">
              <h2 class="text-center mb-1 fw-bold text-primary">CineFlow</h2>
              <p class="text-center text-muted mb-4">Crea tu cuenta</p>

              <div
                id="error-message"
                class="alert alert-danger d-none"
                role="alert"
              ></div>

              <form id="register-form" novalidate>
                <div class="row g-3 mb-3">
                  <div class="col-sm-6">
                    <div class="form-floating">
                      <input type="text" class="form-control" id="nombres" name="nombres"
                             placeholder="Nombres" autocomplete="given-name" required />
                      <label for="nombres">Nombres</label>
                    </div>
                  </div>
                  <div class="col-sm-6">
                    <div class="form-floating">
                      <input type="text" class="form-control" id="apellidos" name="apellidos"
                             placeholder="Apellidos" autocomplete="family-name" required />
                      <label for="apellidos">Apellidos</label>
                    </div>
                  </div>
                </div>

                <div class="form-floating mb-3">
                  <input type="email" class="form-control" id="email" name="email"
                         placeholder="Email" autocomplete="email" required />
                  <label for="email">Email</label>
                </div>

                <div class="form-floating mb-3">
                  <input type="password" class="form-control" id="password" name="password"
                         placeholder="Contraseña" autocomplete="new-password"
                         minlength="8" required />
                  <label for="password">Contraseña (mínimo 8 caracteres)</label>
                </div>

                <div class="form-floating mb-4">
                  <input type="password" class="form-control" id="confirmPassword"
                         name="confirmPassword" placeholder="Confirmar contraseña"
                         autocomplete="new-password" required />
                  <label for="confirmPassword">Confirmar contraseña</label>
                </div>

                <button type="submit" class="btn btn-primary w-100 py-2 fw-bold" id="btn-register">
                  Crear cuenta
                </button>
              </form>

              <p class="text-center text-muted small mt-4 mb-0">
                ¿Ya tienes cuenta? <a href="../../index.html">Inicia sesión</a>
              </p>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script type="module" src="../../js/features/auth/registerView.js"></script>
  </body>
</html>
