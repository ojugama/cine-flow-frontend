<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CineFlow - Iniciar sesión</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./assets/css/styles.css" />
  </head>
  <body class="bg-light d-flex align-items-center" style="min-height: 100vh">
    <div class="container py-4">
      <div class="row justify-content-center">
        <div class="col-md-5">
          <div class="card shadow-sm border-0 rounded-3">
            <div class="card-body p-5">
              <h2 class="text-center mb-4 fw-bold text-primary">CineFlow</h2>

              <div id="info-message" class="alert d-none" role="alert"></div>
              <div
                id="error-message"
                class="alert alert-danger d-none"
                role="alert"
              >
                Email o contraseña incorrectos.
              </div>

              <form id="login-form">
                <div class="form-floating mb-3">
                  <input
                    type="email"
                    class="form-control"
                    id="email"
                    placeholder="Digite el email"
                    autocomplete="username"
                    required
                  />
                  <label for="email">Email</label>
                </div>

                <div class="form-floating mb-4">
                  <input
                    type="password"
                    class="form-control"
                    id="password"
                    placeholder="Digite la contraseña"
                    autocomplete="current-password"
                    required
                  />
                  <label for="password">Contraseña</label>
                </div>

                <button
                  type="submit"
                  class="btn btn-primary w-100 py-2 fw-bold"
                  id="btn-login"
                >
                  Iniciar sesión
                </button>
              </form>

              <p class="text-center text-muted small mt-4 mb-0">
                ¿Aún no tienes cuenta?
                <a href="pages/auth/registro.html">Regístrate</a>
              </p>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script type="module" src="./js/features/auth/loginView.js"></script>
  </body>
</html>
